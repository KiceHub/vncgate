<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNC 远程桌面 - 登录</title>
<style>
:root { --grad1:#1a2980; --grad2:#26d0ce; --card:rgba(255,255,255,.95); --text:#2b3a55; --text2:#7a87a0; --accent:#1a6ee0; --accent2:#26d0ce; --red:#e5484d; --input-bg:#f4f7fd; --border:#dfe7f5; --focus:#1a6ee0; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif; background:linear-gradient(135deg,var(--grad1) 0%,var(--grad2) 100%); color:var(--text); display:flex; justify-content:center; align-items:center; min-height:100vh; }
.login-box { background:var(--card); border-radius:16px; padding:48px 42px; width:390px; box-shadow:0 20px 60px rgba(15,30,80,.35); }
.logo { text-align:center; margin-bottom:8px; font-size:40px; }
.login-box h1 { text-align:center; color:var(--accent); margin-bottom:30px; font-size:22px; letter-spacing:1px; }
.login-box input { width:100%; padding:13px 14px; background:var(--input-bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:inherit; font-size:14px; outline:none; margin-bottom:15px; transition:border-color .2s, box-shadow .2s; }
.login-box input:focus { border-color:var(--focus); box-shadow:0 0 0 3px rgba(26,110,224,.15); }
.login-box input::placeholder { color:var(--text2); opacity:.7; }
.btn { width:100%; padding:13px; background:linear-gradient(90deg,var(--accent) 0%,var(--accent2) 100%); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; margin-top:6px; letter-spacing:6px; transition:opacity .2s, transform .1s; }
.btn:hover { opacity:.9; }
.btn:active { transform:scale(.99); }
.error { color:var(--red); text-align:center; margin-top:16px; font-size:13px; display:none; }
</style>
</head>
<body>
<div class="login-box">
<div class="logo">&#128421;&#65039;</div>
<h1>VNC 远程桌面</h1>
<form id="loginForm">
<input type="text" id="user" placeholder="用户名" value="{{SysUser}}" autocomplete="username">
<input type="password" id="pass" placeholder="密码" autocomplete="current-password">
<button type="submit" class="btn">登 录</button>
</form>
<div class="error" id="error"></div>
</div>
<script>
document.getElementById('loginForm').onsubmit=async function(e){e.preventDefault();var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:document.getElementById('user').value,pass:document.getElementById('pass').value})});var d=await r.json();if(d.ok)location.href='/';else{var er=document.getElementById('error');er.style.display='block';er.textContent=d.message||'登录失败';}};
</script>
</body>
</html>
